<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><link rel="stylesheet" href="assets/site.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
.og{position:relative;width:1200px;height:630px;color:#fff;display:grid;grid-template-columns:520px 1fr;align-items:center;
background:radial-gradient(60% 80% at 80% 35%, rgba(127,139,255,.45), transparent 70%),linear-gradient(160deg,#5b4ae0,#4330b8);overflow:hidden}
.og .copy{padding-left:72px}
.og .mark{display:flex;align-items:center;gap:16px;font:700 30px/1 var(--font-rounded)}
.og .mark img{width:64px;height:64px;border-radius:15px;box-shadow:0 6px 18px rgba(20,10,80,.35)}
.og h1{font:800 64px/1.02 var(--font-display);letter-spacing:-.03em;margin:30px 0 16px}
.og p{font:500 24px/1.35 var(--font);margin:0;max-width:22ch}
.og .art{position:relative;height:100%}
.og .art .open{position:absolute;width:640px;right:-40px;top:120px;filter:drop-shadow(0 30px 40px rgba(10,5,50,.45))}
.og .art .folded{position:absolute;width:210px;left:10px;top:250px;filter:drop-shadow(0 24px 30px rgba(10,5,50,.5))}
</style></head><body>
<div class="og"><div class="copy"><div class="mark"><img src="assets/icon-192.png" alt=""><span>MMChat Duo</span></div>
<h1>Mattermost,<br>made native.</h1><p>For iPhone, iPhone Duo, iPad and Mac.</p></div>
<div class="art"><img class="open" src="assets/duo-open.webp" alt=""><img class="folded" src="assets/duo-folded.webp" alt=""></div></div>
</body></html>
